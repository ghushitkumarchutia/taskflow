services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      target: production
    command: npm run start:api
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./server
      target: production
    command: npm run start:worker
    env_file:
      - ./server/.env
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow?schema=public
      REDIS_URL: redis://redis:6379
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
